<body class="centered">
  {# Says what actually happened. "Not found" would read as a typo and send
     someone back to re-check the URL they were sent, which won't help. #}
  <main class="login">
    <h1><span class="brand-e">e</span>Pepper</h1>
    <p class="muted">This share link has expired. Share links last 24 hours
      — ask for a fresh one.</p>
  </main>
